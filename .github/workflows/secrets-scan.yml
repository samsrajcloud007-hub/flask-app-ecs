name: secrets scan
on:
    workflow_call:

jobs:
    secretscan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            - name: Run Gitleaks 
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}